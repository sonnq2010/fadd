name: Infrastructure verification

on:
  pull_request:
    paths:
      - '.github/workflows/infra-verify.yml'
      - 'src/infra/.gitignore'
      - 'Makefile'
      - 'src/backend/**'
      - 'src/infra/**'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/infra-verify.yml'
      - 'src/infra/.gitignore'
      - 'Makefile'
      - 'src/backend/**'
      - 'src/infra/**'

permissions:
  contents: read

concurrency:
  group: infra-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.1

      - name: Verify backend unit tests
        run: make -C src/backend test-unit

      - name: Verify Terraform templates
        run: make -C src/infra verify

      - name: Build backend API image
        run: docker build --target api -t fadd/backend:verify src/backend

      - name: Build migration image
        run: docker build --target migrations -t fadd/migrations:verify src/backend
